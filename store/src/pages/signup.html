<!--{"title": "Create account | Avermontis", "description": "Create your Avermontis account.", "noindex": true}-->
<div class="wrap auth-wrap"><form class="auth-card" id="signup-form" novalidate><span class="eyebrow">Join Avermontis</span><h1>Create account</h1><p class="muted small">Save your orders, invoices and wishlist in one place.</p>
<div class="field"><label for="signup-name">Your name</label><input id="signup-name" name="name" type="text" autocomplete="name" maxlength="60"><p class="err" id="signup-form-err-name"></p></div>
<div class="field"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254"><p class="err" id="signup-form-err-email"></p></div>
<div class="field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" maxlength="128" data-pw><p class="err" id="signup-form-err-password"></p></div>
<p class="note" style="margin-top:-6px">At least 8 characters, with a letter and a number.</p>
<label class="showpw small"><input type="checkbox" data-showpw> Show password</label>
<div class="form-alert hidden" role="alert"></div><button class="btn block" type="submit">Create account</button>
<p class="small center">Already have an account? <a href="/login">Sign in</a></p></form></div>
