<!--{"title": "Set a new password | Avermontis", "description": "Set a new password for your Avermontis account.", "noindex": true}-->
<div class="wrap auth-wrap"><form class="auth-card" id="reset-form" novalidate><span class="eyebrow">Account help</span><h1>Set a new password</h1>
<div class="field"><label for="reset-password">New password</label><input id="reset-password" name="password" type="password" autocomplete="new-password" maxlength="128" data-pw><p class="err" id="reset-form-err-password"></p></div>
<div class="field"><label for="reset-confirm">Type it again</label><input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" data-pw><p class="err" id="reset-form-err-confirm"></p></div>
<label class="showpw small"><input type="checkbox" data-showpw> Show passwords</label>
<div class="form-alert hidden" role="alert"></div><button class="btn block" type="submit">Save new password</button></form></div>
