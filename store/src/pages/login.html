<!--{"title": "Sign in | Avermontis", "description": "Sign in to your Avermontis account.", "noindex": true}-->
<div class="wrap auth-wrap"><form class="auth-card" id="login-form" novalidate><span class="eyebrow">Welcome back</span><h1>Sign in</h1><p class="muted small">See your orders, invoices and wishlist.</p>
<div class="field"><label for="login-email">Email or username</label><input id="login-email" name="email" type="text" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254"><p class="err" id="login-form-err-email"></p></div>
<div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" data-pw><p class="err" id="login-form-err-password"></p></div>
<div class="auth-row"><label class="showpw small"><input type="checkbox" data-showpw> Show password</label><a class="small" href="/forgot">Forgot password?</a></div>
<div class="form-alert hidden" role="alert"></div><button class="btn block" type="submit">Sign in</button>
<p class="small center">New here? <a id="to-signup" href="/signup">Create an account</a></p></form></div>
