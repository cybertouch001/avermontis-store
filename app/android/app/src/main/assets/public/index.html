<!doctype html>
<html lang="en-IN" class="native-boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AVERMONTIS App | Your skincare ritual</title>
<meta name="description" content="The AVERMONTIS app: a skin profile, your morning and evening ritual with a streak, a private skin diary, an ingredient guide and the full shop with Cash on Delivery.">
<meta name="theme-color" content="#0B0C0B">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preload" href="/assets/fonts/cg-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/m/app.css">
<script src="/native-config.js"></script>
<script src="/products.js"></script>
<script src="/assets/m/app.js" defer></script>
</head>
<body>
<div id="app" data-app="avermontis">
  <div class="views" id="views">
    <section class="view" id="v-home" data-tab="home" aria-label="Home"></section>
    <section class="view" id="v-routine" data-tab="routine" aria-label="My routine"></section>
    <section class="view" id="v-diary" data-tab="diary" aria-label="Skin diary"></section>
    <section class="view" id="v-shop" data-tab="shop" aria-label="Shop"></section>
    <section class="view" id="v-me" data-tab="me" aria-label="Account"></section>
    <section class="view sub" id="v-bag" data-tab="shop" aria-label="Bag"></section>
    <section class="view sub" id="v-checkout" data-tab="shop" aria-label="Checkout"></section>
    <section class="view sub" id="v-learn" data-tab="home" aria-label="Ingredients"></section>
    <section class="view sub" id="v-done" data-tab="shop" aria-label="Order placed"></section>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="App sections">
    <button type="button" data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button type="button" data-go="routine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Routine</button>
    <button type="button" data-go="diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6l1.5-2.5h4L15.5 6"/></svg>Diary</button>
    <button type="button" data-go="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Shop</button>
    <button type="button" data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </nav>
  
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="grab" id="grab"><i></i></div><button class="icon sx" type="button" id="sheet-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sc" id="sheet-body"></div><div class="sfoot hidden" id="sheet-foot"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="user" class="sr" tabindex="-1" aria-hidden="true">
</body>
</html>
